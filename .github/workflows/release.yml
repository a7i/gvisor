name: Release

"on":
  push:
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            bazel_config: "--config=x86_64 --compilation_mode=opt"
            runs-on: ubuntu-latest
            want_elf: x86-64
          - arch: aarch64
            bazel_config: "--config=aarch64 --compilation_mode=opt"
            runs-on: ubuntu-24.04-arm
            want_elf: ARM aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y make file

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runsc and containerd-shim-runsc-v1
        run: |
          mkdir -p bin
          make BAZEL_OPTIONS="${{ matrix.bazel_config }}" copy TARGETS="//runsc:runsc" DESTINATION=bin/
          make BAZEL_OPTIONS="${{ matrix.bazel_config }}" copy TARGETS="//shim:containerd-shim-runsc-v1" DESTINATION=bin/
          mv bin/runsc bin/runsc-${{ matrix.arch }}
          mv bin/containerd-shim-runsc-v1 bin/containerd-shim-runsc-v1-${{ matrix.arch }}

      - name: Verify binary architecture
        run: |
          file bin/runsc-${{ matrix.arch }} | grep -q "${{ matrix.want_elf }}"
          file bin/containerd-shim-runsc-v1-${{ matrix.arch }} | grep -q "${{ matrix.want_elf }}"

      - name: Verify runsc embeds metric-server subcommand
        run: |
          bin/runsc-${{ matrix.arch }} help 2>&1 | grep -q metric-server

      - name: Generate SHA512 checksums
        working-directory: bin
        run: |
          sha512sum runsc-${{ matrix.arch }} > runsc.sha512-${{ matrix.arch }}
          sha512sum containerd-shim-runsc-v1-${{ matrix.arch }} > containerd-shim-runsc-v1.sha512-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
